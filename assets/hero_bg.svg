<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="80%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#31104b"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#1e3a8a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#skyGrad)"/>
  <rect width="1200" height="600" fill="url(#glow)"/>
  
  <!-- Architectural Dome Watermark on Right -->
  <g opacity="0.15" transform="translate(650, 40)">
    <!-- Dome -->
    <path d="M 100,280 C 100,140 300,140 300,280 Z" fill="#ffffff"/>
    <path d="M 160,140 C 160,80 240,80 240,140 Z" fill="#ffffff"/>
    <rect x="195" y="40" width="10" height="50" fill="#ffffff"/>
    <circle cx="200" cy="35" r="8" fill="#ffffff"/>
    <!-- Columns Base -->
    <rect x="50" y="280" width="300" height="20" fill="#ffffff"/>
    <rect x="40" y="300" width="320" height="15" fill="#ffffff"/>
    <!-- Pillars -->
    <rect x="70" y="315" width="16" height="200" fill="#ffffff"/>
    <rect x="110" y="315" width="16" height="200" fill="#ffffff"/>
    <rect x="150" y="315" width="16" height="200" fill="#ffffff"/>
    <rect x="190" y="315" width="16" height="200" fill="#ffffff"/>
    <rect x="230" y="315" width="16" height="200" fill="#ffffff"/>
    <rect x="270" y="315" width="16" height="200" fill="#ffffff"/>
    <rect x="310" y="315" width="16" height="200" fill="#ffffff"/>
    <!-- Foundation -->
    <rect x="20" y="515" width="360" height="40" fill="#ffffff"/>
  </g>
</svg>